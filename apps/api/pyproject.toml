[project]
name = "fire-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]", "sqlalchemy[asyncio]", "asyncpg", "geoalchemy2", "alembic", "redis",
  "pydantic-settings", "nina",
]

[tool.uv.sources]
nina = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
