services:
  nina:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./source:/app/source
    # Every setting and key comes from .env (never committed); the server reads it only inside the container.
    env_file:
      - path: .env
        required: false
    environment:
      NINA_DATA_DIR: /app/data
      NINA_SOURCE_DIR: source
    restart: unless-stopped
