# fly.toml app configuration file generated for nina-cold-stone-3421 on 2026-11-14T19:16:18-05:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'nina-cold-stone-3421'
primary_region = 'gru'

[build]
[env]
# The harmonized product lives on the volume too (data/source/review).
NINA_SOURCE_DIR = 'data/source'
NINA_EXPERIMENTAL_HARMONIZATION = 'true'

[http_service]
internal_port = 8000
force_https = true
# Always on during the evaluation: no cold start and a warm DuckDB cache (~$14/month).
auto_stop_machines = 'stop'
#auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 0
#min_machines_running = 1
processes = ['app']

[mounts]
source = 'nina_data'
destination = '/app/data'

[[vm]]
memory = '2gb'
cpus = 2
