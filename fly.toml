# fly.toml app configuration file generated for nina-cold-stone-3421 on 2026-11-14T19:16:18-05:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'nina-cold-stone-3421'
primary_region = 'gru'

[build]
[env]
# The harmonized product lives on the volume too (data/source/review).
NINA_SOURCE_DIR = 'data/source'
NINA_EXPERIMENTAL_HARMONIZATION = 'true'
# 2 GB machine: a harmonized query takes up to ~1 GB, so the archive database gets less.
NINA_DUCKDB_MEMORY_LIMIT = '768MB'
NINA_PREWARM = 'true'
NINA_ANALYST_MODEL = 'claude-haiku-5-5'
NINA_ANALYST_EFFORT = 'medium'

[http_service]
internal_port = 8000
force_https = true
# 'stop' + min 0: the machine sleeps without visitors (cold start of a few seconds). For always on: 'off' and 1.
auto_stop_machines = 'stop'
#auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 0
#min_machines_running = 1
processes = ['app']

[mounts]
source = 'nina_data'
destination = '/app/data'

[[vm]]
memory = '2gb'
cpus = 2
