# Uso (desde la raíz): docker compose --env-file .env -f infra/docker-compose.yml up -d
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fire}
      POSTGRES_USER: ${POSTGRES_USER:-fire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fire}"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?definir en .env}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  martin:
    image: ghcr.io/maplibre/martin
    command: --config /config/martin.yaml
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fire}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fire}
    volumes: [./docker/martin.yaml:/config/martin.yaml:ro]
    depends_on:
      db: { condition: service_healthy }
    ports: ["3000:3000"]
volumes:
  pgdata:
  miniodata:
