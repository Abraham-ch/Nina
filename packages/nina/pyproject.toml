[project]
name = "nina"
version = "0.1.0"
description = "Armonización de focos de calor MODIS + VIIRS (NASA FIRMS)"
requires-python = ">=3.12"
dependencies = [
  "polars>=1.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyogrio>=0.9",
  "h3>=4.0",
  "duckdb>=1.0",
  "jsonschema>=4.22",
  "pyyaml>=6",
  "httpx>=0.27",
  "paramiko>=3.4",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "python-dotenv>=1,<2",
  "truststore>=0.10,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]
